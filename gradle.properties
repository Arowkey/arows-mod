# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.20.0
loom_version=1.19.1

# Mod Properties
mod_version=0.1.2
maven_group=com.arowkey.arowsmod

# Dependencies
# Minecraft 26.1+ ships unobfuscated. Fabric does not publish Yarn past 1.21.11,
# so this project has no mappings dependency.
fabric_api_version=0.163.0+26.3
# https://modrinth.com/plugin/pl3xmap/version/26.3-557
pl3xmap_version=26.3-557
